<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Panel - DPW PAN NTT</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/admin.css" />
    <script src="https://unpkg.com/feather-icons"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link
      href="https://cdn.quilljs.com/1.3.6/quill.snow.css"
      rel="stylesheet"
    />
    <script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css"
    />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap");
      body {
        font-family: "Inter", sans-serif;
      }
      .bg-brand {
        background-color: #00529b;
      }
      .text-brand {
        color: #00529b;
      }
    </style>
  </head>
  <body class="bg-stone-100 min-h-screen pb-20">
    <!-- Login Section -->
    <div
      id="login-section"
      class="fixed inset-0 bg-brand flex items-center justify-center z-[100]"
    >
      <div class="bg-white p-10 rounded-3xl shadow-2xl w-full max-w-md mx-4">
        <div class="text-center mb-2 flex flex-col items-center">
          <img
            src="public/login-logo.png"
            alt="Logo PAN"
            class="h-28 w-28 object-contain mb-2"
          />
          <!-- <h2 class="text-3xl font-black tracking-tighter text-brand uppercase">
            PAN NTT
          </h2> -->
          <p
            class="mb-3 text-stone-500 font-bold uppercase tracking-widest text-xs mt-1"
          >
            Admin Control Panel
          </p>
        </div>
        <form onsubmit="handleLogin(event)" class="space-y-4">
          <div>
            <label class="text-xs font-bold text-stone-400 ml-2 uppercase"
              >Username</label
            >
            <input
              type="text"
              name="username"
              class="w-full p-4 bg-stone-50 border rounded-2xl focus:ring-2 focus:ring-brand outline-none"
              required
            />
          </div>
          <div>
            <label class="text-xs font-bold text-stone-400 ml-2 uppercase"
              >Password</label
            >
            <input
              type="password"
              name="password"
              class="w-full p-4 bg-stone-50 border rounded-2xl focus:ring-2 focus:ring-brand outline-none"
              required
            />
          </div>
          <button
            type="submit"
            class="w-full bg-brand text-white font-black py-3 rounded-2xl hover:bg-blue-800 transition-all uppercase shadow-lg"
          >
            <i class="fa-solid fa-right-to-bracket"></i> Masuk
          </button>
        </form>
      </div>
    </div>

    <!-- Main Admin Content -->
    <div id="admin-content" class="hidden">
      <nav class="admin-navbar" id="admin-navbar">
        <div class="admin-navbar-inner">
          <a
            class="admin-navbar-brand"
            href="#"
            onclick="handleNavClick(event)"
          >
            <img src="public/logo2.jpeg" alt="Logo" />
            <div class="admin-navbar-title">
              <span>PAN NTT</span>
              <span>ADMIN PANEL</span>
            </div>
          </a>
          <div class="admin-navbar-nav">
            <ul class="admin-navbar-links">
              <li>
                <a
                  href="#berita"
                  onclick="
                    showTab('berita');
                    return false;
                  "
                  >Berita</a
                >
              </li>
              <li>
                <a
                  href="#dokumentasi"
                  onclick="
                    showTab('dokumentasi');
                    return false;
                  "
                  >Dokumentasi</a
                >
              </li>
              <li>
                <a
                  href="#pengurus"
                  onclick="
                    showTab('pengurus');
                    return false;
                  "
                  >Pengurus</a
                >
              </li>
              <li>
                <a
                  href="#agenda"
                  onclick="
                    showTab('agenda');
                    return false;
                  "
                  >Agenda</a
                >
              </li>
              <li>
                <a
                  href="#statistik"
                  onclick="
                    showTab('statistik');
                    return false;
                  "
                  >Statistik</a
                >
              </li>
            </ul>
            <button onclick="handleLogout()" class="admin-navbar-logout">
              Logout <i data-feather="log-out"></i>
            </button>
          </div>
        </div>
      </nav>

      <div class="max-w-6xl mx-auto px-4">
        <!-- Section Berita -->
        <div id="section-berita" class="admin-section">
          <div class="bg-white p-8 rounded-3xl shadow-sm mb-8">
            <h2 id="form-title-berita" class="text-2xl font-black mb-6">
              Tambah Berita Baru
            </h2>
            <form
              id="form-berita"
              onsubmit="saveData(event, 'berita')"
              class="grid grid-cols-1 md:grid-cols-2 gap-4"
            >
              <input type="hidden" name="id" />
              <input type="hidden" name="oldImage" />
              <input
                name="title"
                placeholder="Judul Berita"
                class="p-4 bg-stone-50 border rounded-2xl"
                required
              />
              <input
                type="date"
                name="date"
                class="p-4 bg-stone-50 border rounded-2xl"
                required
              />
              <select
                name="kategori"
                class="p-4 bg-stone-50 border rounded-2xl md:col-span-2 text-stone-600"
                required
              >
                <option value="" disabled selected>
                  Pilih Kategori Berita
                </option>
                <option value="Kegiatan Kader">Kegiatan Kader</option>
                <option value="Pernyataan Resmi">Pernyataan Resmi</option>
                <option value="Kebijakan Publik">Kebijakan Publik</option>
                <option value="Nasional">Nasional</option>
                <option value="Daerah">Daerah</option>
                <option value="Umum">Umum</option>
              </select>
              <div class="flex flex-col gap-1">
                <label class="text-xs font-bold text-stone-400 ml-2"
                  >Upload Gambar (Kosongkan jika tidak ingin ganti)</label
                >
                <input
                  type="file"
                  name="imageFile"
                  accept="image/*"
                  onchange="previewImage(event, 'berita')"
                  class="p-3 bg-stone-50 border rounded-2xl text-sm"
                />
                <img
                  id="preview-berita"
                  class="mt-2 h-32 w-full object-cover rounded-xl border hidden"
                />
              </div>
              <textarea
                name="excerpt"
                placeholder="Ringkasan Singkat"
                class="p-4 bg-stone-50 border rounded-2xl md:col-span-2"
                required
              ></textarea>
              <div class="md:col-span-2">
                <label class="text-xs font-bold text-stone-400 ml-2 mb-1 block"
                  >Isi Berita Lengkap</label
                >
                <div
                  id="editor-container"
                  class="bg-stone-50 border rounded-2xl h-64"
                ></div>
                <input type="hidden" name="content" id="newsContent" />
              </div>
              <div class="md:col-span-2 flex gap-2">
                <button
                  type="submit"
                  id="btn-submit-berita"
                  class="flex-1 bg-brand text-white font-black py-4 rounded-2xl hover:bg-blue-800 transition-all uppercase"
                >
                  Posting Berita
                </button>
                <button
                  type="button"
                  onclick="resetForm('berita')"
                  id="btn-cancel-berita"
                  class="hidden px-8 bg-stone-200 text-stone-600 font-bold rounded-2xl hover:bg-stone-300"
                >
                  BATAL
                </button>
              </div>
            </form>
          </div>
          <div id="list-berita" class="space-y-4"></div>
        </div>

        <!-- Section Dokumentasi -->
        <div id="section-dokumentasi" class="admin-section hidden">
          <div class="bg-white p-8 rounded-3xl shadow-sm mb-8">
            <h2 id="form-title-dokumentasi" class="text-2xl font-black mb-6">
              Tambah Foto Galeri
            </h2>
            <form
              id="form-dokumentasi"
              onsubmit="saveData(event, 'dokumentasi')"
              class="grid grid-cols-1 md:grid-cols-2 gap-4"
            >
              <input type="hidden" name="id" />
              <input type="hidden" name="oldImage" />
              <input
                name="title"
                placeholder="Keterangan Foto Utama"
                class="p-4 bg-stone-50 border rounded-2xl"
                required
              />
              <select
                name="kategori"
                class="p-4 bg-stone-50 border rounded-2xl text-stone-600"
                required
              >
                <option value="" disabled selected>
                  Pilih Kategori Galeri
                </option>
                <option value="Semua">Semua</option>
                <option value="Nasional">Nasional</option>
                <option value="Daerah">Daerah</option>
                <option value="Sosial">Sosial</option>
                <option value="Kegiatan Kader">Kegiatan Kader</option>
                <option value="Umum">Umum</option>
              </select>

              <div
                class="md:col-span-2 grid grid-cols-1 sm:grid-cols-3 md:grid-cols-5 gap-4"
              >
                <div class="flex flex-col gap-1">
                  <label class="text-xs font-bold text-brand ml-2"
                    >Foto Utama (Wajib)</label
                  >
                  <input
                    type="file"
                    name="imageFile"
                    accept="image/*"
                    onchange="previewImage(event, 'dokumentasi', '')"
                    class="p-3 bg-stone-50 border rounded-2xl text-sm"
                    required
                  />
                  <img
                    id="preview-dokumentasi"
                    class="mt-2 h-24 w-full object-cover rounded-xl border hidden"
                  />
                </div>
                <div class="flex flex-col gap-1">
                  <label class="text-xs font-bold text-stone-400 ml-2"
                    >Foto Tambahan 2</label
                  >
                  <input
                    type="file"
                    name="imageFile2"
                    accept="image/*"
                    onchange="previewImage(event, 'dokumentasi', '2')"
                    class="p-3 bg-stone-50 border rounded-2xl text-sm"
                  />
                  <input type="hidden" name="oldImage2" />
                  <img
                    id="preview-dokumentasi2"
                    class="mt-2 h-24 w-full object-cover rounded-xl border hidden"
                  />
                </div>
                <div class="flex flex-col gap-1">
                  <label class="text-xs font-bold text-stone-400 ml-2"
                    >Foto Tambahan 3</label
                  >
                  <input
                    type="file"
                    name="imageFile3"
                    accept="image/*"
                    onchange="previewImage(event, 'dokumentasi', '3')"
                    class="p-3 bg-stone-50 border rounded-2xl text-sm"
                  />
                  <input type="hidden" name="oldImage3" />
                  <img
                    id="preview-dokumentasi3"
                    class="mt-2 h-24 w-full object-cover rounded-xl border hidden"
                  />
                </div>
                <div class="flex flex-col gap-1">
                  <label class="text-xs font-bold text-stone-400 ml-2"
                    >Foto Tambahan 4</label
                  >
                  <input
                    type="file"
                    name="imageFile4"
                    accept="image/*"
                    onchange="previewImage(event, 'dokumentasi', '4')"
                    class="p-3 bg-stone-50 border rounded-2xl text-sm"
                  />
                  <input type="hidden" name="oldImage4" />
                  <img
                    id="preview-dokumentasi4"
                    class="mt-2 h-24 w-full object-cover rounded-xl border hidden"
                  />
                </div>
                <div class="flex flex-col gap-1">
                  <label class="text-xs font-bold text-stone-400 ml-2"
                    >Foto Tambahan 5</label
                  >
                  <input
                    type="file"
                    name="imageFile5"
                    accept="image/*"
                    onchange="previewImage(event, 'dokumentasi', '5')"
                    class="p-3 bg-stone-50 border rounded-2xl text-sm"
                  />
                  <input type="hidden" name="oldImage5" />
                  <img
                    id="preview-dokumentasi5"
                    class="mt-2 h-24 w-full object-cover rounded-xl border hidden"
                  />
                </div>
              </div>
              <div class="md:col-span-2 flex gap-2">
                <button
                  type="submit"
                  id="btn-submit-dokumentasi"
                  class="flex-1 bg-brand text-white font-black py-4 rounded-2xl hover:bg-blue-800 transition-all uppercase"
                >
                  Simpan Foto
                </button>
                <button
                  type="button"
                  onclick="resetForm('dokumentasi')"
                  id="btn-cancel-dokumentasi"
                  class="hidden px-8 bg-stone-200 text-stone-600 font-bold rounded-2xl hover:bg-stone-300"
                >
                  BATAL
                </button>
              </div>
            </form>
          </div>
          <div
            id="list-dokumentasi"
            class="grid grid-cols-2 md:grid-cols-4 gap-4"
          ></div>
        </div>

        <!-- Section Pengurus -->
        <div id="section-pengurus" class="admin-section hidden">
          <div class="bg-white p-8 rounded-3xl shadow-sm mb-8">
            <h2 id="form-title-pengurus" class="text-2xl font-black mb-6">
              Tambah Pengurus DPW
            </h2>
            <form
              id="form-pengurus"
              onsubmit="saveData(event, 'pengurus')"
              class="grid grid-cols-1 md:grid-cols-3 gap-4"
            >
              <input type="hidden" name="id" />
              <input type="hidden" name="oldImage" />
              <input
                name="nama"
                placeholder="Nama Lengkap"
                class="p-4 bg-stone-50 border rounded-2xl"
                required
              />
              <input
                name="jabatan"
                placeholder="Jabatan"
                class="p-4 bg-stone-50 border rounded-2xl"
                required
              />
              <div class="flex flex-col gap-1">
                <label class="text-xs font-bold text-stone-400 ml-2"
                  >Upload Foto</label
                >
                <div
                  id="upload-dropzone-pengurus"
                  class="relative border-2 border-dashed border-stone-300 rounded-2xl p-4 bg-stone-50 hover:bg-stone-100 hover:border-brand transition-all cursor-pointer text-center"
                  ondrop="handleDrop(event, 'pengurus')"
                  ondragover="
                    event.preventDefault();
                    event.currentTarget.classList.add(
                      'border-brand',
                      'bg-brand/5',
                    );
                  "
                  ondragleave="
                    event.currentTarget.classList.remove(
                      'border-brand',
                      'bg-brand/5',
                    )
                  "
                >
                  <input
                    type="file"
                    name="imageFile"
                    accept="image/*"
                    onchange="previewImage(event, 'pengurus')"
                    class="hidden"
                    id="fileInput-pengurus"
                  />
                  <label for="fileInput-pengurus" class="cursor-pointer block">
                    <p class="text-xs font-bold text-stone-500">
                      <i class="fa-solid fa-image"></i>
                    </p>
                    <p class="text-xs text-stone-400 mt-1">
                      PNG, JPG, GIF (Max: 5MB)
                    </p>
                  </label>
                </div>
                <div class="relative group mt-2">
                  <img
                    id="preview-pengurus"
                    class="h-32 w-full object-cover rounded-xl border hidden cursor-pointer transition-transform hover:scale-105"
                    onclick="handlePreviewClick('pengurus')"
                  />
                  <div
                    class="absolute inset-0 rounded-xl bg-black/0 group-hover:bg-black/30 opacity-0 group-hover:opacity-100 transition-all flex items-center justify-center hidden group-hover:flex"
                  >
                    <button
                      type="button"
                      id="preview-btn-pengurus"
                      onclick="handlePreviewClick('pengurus')"
                      class="bg-white text-brand px-4 py-2 rounded-lg font-bold text-sm hover:bg-stone-100"
                    >
                      <i class="fa-solid fa-pen-to-square"></i>
                    </button>
                  </div>
                </div>
              </div>
              <div class="md:col-span-3 flex gap-2">
                <button
                  type="submit"
                  id="btn-submit-pengurus"
                  class="flex-1 bg-brand text-white font-black py-4 rounded-2xl hover:bg-blue-800 transition-all uppercase"
                >
                  Tambah Pengurus
                </button>
                <button
                  type="button"
                  onclick="resetForm('pengurus')"
                  id="btn-cancel-pengurus"
                  class="hidden px-8 bg-stone-200 text-stone-600 font-bold rounded-2xl hover:bg-stone-300"
                >
                  BATAL
                </button>
              </div>
            </form>
          </div>
          <div id="list-pengurus" class="space-y-4"></div>
        </div>

        <!-- Section Agenda -->
        <div id="section-agenda" class="admin-section hidden">
          <div class="bg-white p-8 rounded-3xl shadow-sm mb-8">
            <h2 id="form-title-agenda" class="text-2xl font-black mb-6">
              Tambah Agenda Baru
            </h2>
            <form
              id="form-agenda"
              onsubmit="saveData(event, 'agenda')"
              class="grid grid-cols-1 md:grid-cols-2 gap-4"
            >
              <input type="hidden" name="id" />
              <input
                name="title"
                placeholder="Nama / Judul Agenda"
                class="p-4 bg-stone-50 border rounded-2xl"
                required
              />
              <input
                type="date"
                name="date"
                class="p-4 bg-stone-50 border rounded-2xl"
                required
              />
              <input
                name="location"
                placeholder="Lokasi Pelaksanaan"
                class="p-4 bg-stone-50 border rounded-2xl md:col-span-2"
                required
              />
              <div class="md:col-span-2 flex gap-2">
                <button
                  type="submit"
                  id="btn-submit-agenda"
                  class="flex-1 bg-brand text-white font-black py-4 rounded-2xl hover:bg-blue-800 transition-all uppercase"
                >
                  Simpan Agenda
                </button>
                <button
                  type="button"
                  onclick="resetForm('agenda')"
                  id="btn-cancel-agenda"
                  class="hidden px-8 bg-stone-200 text-stone-600 font-bold rounded-2xl hover:bg-stone-300"
                >
                  BATAL
                </button>
              </div>
            </form>
          </div>
          <div id="list-agenda" class="space-y-4"></div>
        </div>

        <!-- Section Statistik -->
        <div id="section-statistik" class="admin-section hidden">
          <div
            id="form-container-statistik"
            class="bg-white p-8 rounded-3xl shadow-sm mb-8 hidden"
          >
            <h2 id="form-title-statistik" class="text-2xl font-black mb-6">
              Edit Statistik
            </h2>
            <form
              id="form-statistik"
              onsubmit="saveData(event, 'statistik')"
              class="grid grid-cols-1 md:grid-cols-2 gap-4"
            >
              <input type="hidden" name="id" />
              <input
                name="key_name"
                id="stat_key_name"
                readonly
                placeholder="Key ID (Otomatis)"
                class="p-4 bg-stone-100 border rounded-2xl cursor-not-allowed text-stone-500"
                required
              />
              <input
                name="label"
                placeholder="Label Teks (Misal: DPC Tingkat Kecamatan)"
                oninput="
                  document.getElementById('stat_key_name').value = this.value
                    .toLowerCase()
                    .replace(/[^a-z0-9]/g, '_')
                    .replace(/_+/g, '_')
                    .replace(/^_|_$/g, '')
                "
                class="p-4 bg-stone-50 border rounded-2xl"
                required
              />
              <input
                type="number"
                name="value"
                placeholder="Nilai Angka (Misal: 314)"
                class="p-4 bg-stone-50 border rounded-2xl"
                required
              />
              <input
                name="suffix"
                placeholder="Akhiran (Misal: % atau K+)"
                class="p-4 bg-stone-50 border rounded-2xl"
              />
              <div class="md:col-span-2 flex gap-2 mt-4">
                <button
                  type="submit"
                  id="btn-submit-statistik"
                  class="flex-1 bg-brand text-white font-black py-4 rounded-2xl hover:bg-blue-800 transition-all uppercase"
                >
                  Simpan Perubahan
                </button>
                <button
                  type="button"
                  onclick="resetForm('statistik')"
                  id="btn-cancel-statistik"
                  class="px-8 bg-stone-200 text-stone-600 font-bold rounded-2xl hover:bg-stone-300"
                >
                  TUTUP
                </button>
              </div>
            </form>
          </div>
          <div
            id="list-statistik"
            class="grid grid-cols-1 sm:grid-cols-2 gap-4"
          ></div>
        </div>
      </div>
    </div>

    <!-- Crop Image Modal - Enhanced -->
    <div
      id="crop-modal"
      class="hidden fixed inset-0 bg-black/70 z-50 flex items-center justify-center p-4"
    >
      <div
        class="bg-white rounded-3xl shadow-2xl w-full max-w-4xl max-h-[95vh] overflow-hidden flex flex-col"
      >
        <!-- Header -->
        <div
          class="sticky top-0 bg-brand text-white px-6 py-4 flex justify-between items-center"
        >
          <div>
            <h3 class="font-bold text-lg">Crop Foto</h3>
          </div>
          <button
            type="button"
            onclick="closeCropModal()"
            class="text-white hover:bg-white/20 p-2 rounded-lg transition-all"
          >
            <svg
              class="w-6 h-6"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M6 18L18 6M6 6l12 12"
              ></path>
            </svg>
          </button>
        </div>

        <!-- Main Content -->
        <div class="flex-1 overflow-y-auto">
          <div class="p-6 grid grid-cols-1 lg:grid-cols-3 gap-6">
            <!-- Image Editor Section -->
            <div class="lg:col-span-2">
              <!-- Image Container -->
              <div
                class="bg-stone-900 rounded-xl overflow-hidden flex items-center justify-center"
                style="height: 400px"
              >
                <img
                  id="crop-image"
                  src=""
                  alt=""
                  style="max-width: 100%; max-height: 100%; display: block"
                />
              </div>

              <!-- Aspect Ratio Presets -->
              <div class="mt-4">
                <label class="text-xs font-bold text-stone-500 block mb-2"
                  >RASIO ASPEK</label
                >
                <div class="grid grid-cols-5 gap-2">
                  <button
                    type="button"
                    onclick="setAspectRatio(NaN)"
                    class="py-2 px-2 text-xs font-bold bg-stone-100 rounded-lg hover:bg-brand hover:text-white transition-all"
                    id="aspect-free"
                  >
                    Bebas
                  </button>
                  <button
                    type="button"
                    onclick="setAspectRatio(1)"
                    class="py-2 px-2 text-xs font-bold bg-stone-100 rounded-lg hover:bg-brand hover:text-white transition-all"
                    id="aspect-1-1"
                  >
                    1:1
                  </button>
                  <button
                    type="button"
                    onclick="setAspectRatio(16 / 9)"
                    class="py-2 px-2 text-xs font-bold bg-stone-100 rounded-lg hover:bg-brand hover:text-white transition-all"
                    id="aspect-16-9"
                  >
                    16:9
                  </button>
                  <button
                    type="button"
                    onclick="setAspectRatio(4 / 3)"
                    class="py-2 px-2 text-xs font-bold bg-stone-100 rounded-lg hover:bg-brand hover:text-white transition-all"
                    id="aspect-4-3"
                  >
                    4:3
                  </button>
                  <button
                    type="button"
                    onclick="setAspectRatio(9 / 16)"
                    class="py-2 px-2 text-xs font-bold bg-stone-100 rounded-lg hover:bg-brand hover:text-white transition-all"
                    id="aspect-9-16"
                  >
                    9:16
                  </button>
                </div>
              </div>

              <!-- Zoom Control -->
              <div class="mt-4">
                <label class="text-xs font-bold text-stone-500 block mb-2"
                  >ZOOM</label
                >
                <div class="flex items-center gap-3">
                  <button
                    type="button"
                    onclick="zoomCrop(-0.1)"
                    class="p-2 bg-stone-100 text-stone-600 rounded-lg hover:bg-brand hover:text-white transition-all"
                  >
                    −
                  </button>
                  <input
                    type="range"
                    id="zoom-slider"
                    min="0"
                    max="5"
                    step="0.1"
                    value="1"
                    onchange="zoomCropToValue(this.value)"
                    class="flex-1 h-2 bg-stone-200 rounded-lg appearance-none cursor-pointer"
                    style="accent-color: #00529b"
                  />
                  <button
                    type="button"
                    onclick="zoomCrop(0.1)"
                    class="p-2 bg-stone-100 text-stone-600 rounded-lg hover:bg-brand hover:text-white transition-all"
                  >
                    +
                  </button>
                </div>
              </div>
            </div>

            <!-- Controls Sidebar -->
            <div class="space-y-4">
              <!-- Preview -->
              <div>
                <label class="text-xs font-bold text-stone-500 block mb-2"
                  >PREVIEW</label
                >
                <div
                  id="crop-preview"
                  class="w-full aspect-square bg-stone-50 rounded-2xl overflow-hidden border-2 border-brand"
                >
                  <img src="" alt="" class="w-full h-full object-cover" />
                </div>
              </div>

              <!-- Rotation Controls -->
              <div>
                <label class="text-xs font-bold text-stone-500 block mb-2"
                  >ROTASI</label
                >
                <div class="space-y-2">
                  <button
                    type="button"
                    onclick="rotateCrop(90)"
                    class="w-full py-2 px-3 bg-stone-100 text-stone-700 rounded-lg font-bold text-sm hover:bg-brand hover:text-white transition-all"
                  >
                    ⟳ Putar 90°
                  </button>
                  <button
                    type="button"
                    onclick="rotateCrop(-90)"
                    class="w-full py-2 px-3 bg-stone-100 text-stone-700 rounded-lg font-bold text-sm hover:bg-brand hover:text-white transition-all"
                  >
                    ⟲ Putar -90°
                  </button>
                </div>
              </div>

              <!-- Flip Controls -->
              <div>
                <label class="text-xs font-bold text-stone-500 block mb-2"
                  >FLIP</label
                >
                <div class="grid grid-cols-2 gap-2">
                  <button
                    type="button"
                    onclick="flipCropH()"
                    class="py-2 px-2 bg-stone-100 text-stone-700 rounded-lg font-bold text-xs hover:bg-brand hover:text-white transition-all"
                  >
                    ↔ Horizontal
                  </button>
                  <button
                    type="button"
                    onclick="flipCropV()"
                    class="py-2 px-2 bg-stone-100 text-stone-700 rounded-lg font-bold text-xs hover:bg-brand hover:text-white transition-all"
                  >
                    ↕ Vertikal
                  </button>
                </div>
              </div>

              <!-- Reset Button -->
              <button
                type="button"
                onclick="resetCrop()"
                class="w-full py-2 px-3 bg-stone-200 text-stone-700 rounded-lg font-bold text-sm hover:bg-stone-300 transition-all"
              >
                ↺ Reset
              </button>
            </div>
          </div>
        </div>

        <!-- Footer Actions -->
        <div class="bg-stone-50 px-6 py-4 flex gap-2 border-t">
          <button
            type="button"
            onclick="closeCropModal()"
            class="flex-1 px-4 py-3 bg-stone-200 text-stone-600 rounded-xl font-bold hover:bg-stone-300 transition-all"
          >
            Batal
          </button>
          <button
            type="button"
            onclick="saveCrop()"
            class="flex-1 px-4 py-3 bg-brand text-white rounded-xl font-bold hover:bg-blue-800 transition-all flex items-center justify-center gap-2"
          >
            <span>✓</span> Simpan Crop
          </button>
        </div>
      </div>
    </div>

    <script>
      const API_BASE = "https://panwebtes.katongpung.com/api.php";
      let currentData = {
        berita: [],
        dokumentasi: [],
        pengurus: [],
        agenda: [],
        statistik: [],
      };

      // Authentication Logic
      function checkAuth() {
        const session = localStorage.getItem("pan_admin_session");
        if (session) {
          document.getElementById("login-section").classList.add("hidden");
          document.getElementById("admin-content").classList.remove("hidden");
          loadData("berita");
        } else {
          document.getElementById("login-section").classList.remove("hidden");
          document.getElementById("admin-content").classList.add("hidden");
        }
      }

      async function handleLogin(e) {
        e.preventDefault();
        const formData = new FormData(e.target);

        Swal.fire({
          title: "Mohon Tunggu...",
          text: "Sedang memverifikasi data login",
          allowOutsideClick: false,
          didOpen: () => {
            Swal.showLoading();
          },
        });

        try {
          const res = await fetch(`${API_BASE}?action=login`, {
            method: "POST",
            body: formData,
          });
          const result = await res.json();
          if (result.success) {
            Swal.fire({
              icon: "success",
              title: "Login Berhasil",
              showConfirmButton: false,
              timer: 1500,
            });
            localStorage.setItem("pan_admin_session", result.token);
            checkAuth();
          } else {
            Swal.fire({
              icon: "error",
              title: "Login Gagal",
              text: result.error || "Username atau password salah",
            });
          }
        } catch (error) {
          Swal.fire({
            icon: "error",
            title: "Kesalahan",
            text: "Terjadi masalah koneksi ke server",
          });
        }
      }

      function handleLogout() {
        localStorage.removeItem("pan_admin_session");
        checkAuth();
      }

      // Initialize Quill
      const quill = new Quill("#editor-container", {
        theme: "snow",
        modules: {
          toolbar: [
            [{ header: [1, 2, 3, false] }],
            ["bold", "italic", "underline"],
            [{ list: "ordered" }, { list: "bullet" }],
            ["link", "clean"],
          ],
        },
      });

      function showTab(tab) {
        document
          .querySelectorAll(".admin-section")
          .forEach((s) => s.classList.add("hidden"));
        document.getElementById(`section-${tab}`).classList.remove("hidden");
        resetForm(tab);
        loadData(tab);
      }

      let globalCropper = null;
      let currentCropType = "";
      let currentCropIndex = "";
      let originalImageData = null;
      let croppedImageBlob = null;
      let isNewPhotoInEditMode = false; // Track foto baru di edit mode

      function previewImage(event, type, index = "") {
        const preview = document.getElementById(`preview-${type}${index}`);
        const file = event.target.files[0];
        const formId = document.getElementById(`form-${type}`).elements["id"];
        const isEditMode = formId && formId.value !== "";

        if (file) {
          const reader = new FileReader();
          reader.onload = function (e) {
            preview.src = e.target.result;
            preview.classList.remove("hidden");
            // Simpan original image data untuk crop
            originalImageData = e.target.result;

            // Jika di edit mode, set flag bahwa ini foto baru
            if (isEditMode && type === "pengurus") {
              isNewPhotoInEditMode = true;
              // Ubah icon menjadi edit/crop
              const previewBtn = document.getElementById(`preview-btn-${type}`);
              if (previewBtn) {
                previewBtn.innerHTML =
                  '<i class="fa-solid fa-pen-to-square"></i>';
              }
            }

            // Langsung buka modal crop setelah foto dimuat
            setTimeout(() => {
              openCropModal(type, index);
            }, 100);
          };
          reader.readAsDataURL(file);
        } else {
          preview.src = "";
          preview.classList.add("hidden");
          originalImageData = null;
        }
      }

      function handleDrop(event, type, index = "") {
        event.preventDefault();
        const dropzone = event.currentTarget;
        dropzone.classList.remove("border-brand", "bg-brand/5");

        const files = event.dataTransfer.files;
        if (files.length > 0) {
          const file = files[0];
          if (file.type.startsWith("image/")) {
            const fileInput = document.getElementById(
              `fileInput-${type}${index}`,
            );
            const dataTransfer = new DataTransfer();
            dataTransfer.items.add(file);
            fileInput.files = dataTransfer.files;

            const event2 = new Event("change", { bubbles: true });
            fileInput.dispatchEvent(event2);
          } else {
            Swal.fire({
              icon: "warning",
              title: "Format Tidak Valid",
              text: "Silakan upload file gambar (PNG, JPG, GIF)",
            });
          }
        }
      }

      function openCropModal(type, index = "") {
        currentCropType = type;
        currentCropIndex = index;
        const preview = document.getElementById(`preview-${type}${index}`);

        if (!preview || preview.src === "" || !preview.src) {
          Swal.fire({
            icon: "warning",
            title: "Pilih Gambar Terlebih Dahulu",
            text: "Silakan upload gambar sebelum melakukan crop",
          });
          return;
        }

        const modal = document.getElementById("crop-modal");
        const cropImg = document.getElementById("crop-image");

        cropImg.src = preview.src;
        cropImg.style.display = "block";

        modal.classList.remove("hidden");

        // Destroy previous cropper if exists
        if (globalCropper) {
          globalCropper.destroy();
        }

        // Initialize new cropper
        setTimeout(() => {
          // Set default aspect ratio - 1:1 for pengurus, free for others
          const defaultAspectRatio = type === "pengurus" ? 1 : NaN;

          globalCropper = new Cropper(cropImg, {
            aspectRatio: defaultAspectRatio,
            viewMode: 1,
            autoCropArea: 1,
            responsive: true,
            restore: true,
            guides: true,
            center: true,
            highlight: true,
            cropBoxMovable: true,
            cropBoxResizable: true,
            toggleDragModeOnDblclick: true,
            canvas: { maxWidth: 4096, maxHeight: 4096, fillColor: "#fff" },
            preview: "#crop-preview img",
          });

          // Set default aspect ratio button style
          document
            .querySelectorAll('[id^="aspect-"]')
            .forEach((btn) => btn.classList.remove("bg-brand", "text-white"));
          if (type === "pengurus") {
            document
              .getElementById("aspect-1-1")
              ?.classList.add("bg-brand", "text-white");
          } else {
            document
              .getElementById("aspect-free")
              ?.classList.add("bg-brand", "text-white");
          }

          // Update zoom slider
          const slider = document.getElementById("zoom-slider");
          if (slider) {
            slider.value = 1;
          }

          // Update preview saat ada perubahan
          cropImg.addEventListener("crop", updateCropPreview);
        }, 100);
      }

      function updateCropPreview() {
        if (globalCropper) {
          try {
            const canvas = globalCropper.getCroppedCanvas();
            const previewImg = document.querySelector("#crop-preview img");
            if (previewImg && canvas) {
              previewImg.src = canvas.toDataURL();
            }
          } catch (err) {
            console.error("Preview update error:", err);
          }
        }
      }

      function handlePreviewClick(type) {
        const formId = document.getElementById(`form-${type}`).elements["id"];
        const isEditMode = formId && formId.value !== "";

        if (isEditMode && isNewPhotoInEditMode) {
          // Edit mode dengan foto baru - bisa crop
          openCropModal(type);
        } else if (isEditMode && !isNewPhotoInEditMode) {
          // Edit mode dengan foto lama - hanya lihat
          const preview = document.getElementById(`preview-${type}`);
          openPreviewModal(preview.src);
        } else {
          // Tambah mode - bisa crop
          openCropModal(type);
        }
      }

      function closeCropModal() {
        const modal = document.getElementById("crop-modal");
        if (modal) {
          modal.classList.add("hidden");
        }
        if (globalCropper) {
          try {
            globalCropper.destroy();
          } catch (err) {
            console.error("Error destroying cropper:", err);
          }
          globalCropper = null;
        }

        // Jika edit mode dengan foto baru tapi dibatalkan, ubah icon ke preview-only
        if (currentCropType === "pengurus") {
          const formId = document.getElementById(`form-${currentCropType}`)
            .elements["id"];
          const isEditMode = formId && formId.value !== "";
          if (isEditMode && isNewPhotoInEditMode) {
            // Tetap pertahankan flag karena user mungkin kembali crop
            // Icon sudah berupa edit, jadi biarkan
          }
        }

        currentCropType = "";
        currentCropIndex = "";
      }

      function openPreviewModal(imageUrl) {
        const modal = document.getElementById("preview-photo-modal");
        if (!modal) {
          // Buat modal jika belum ada
          const newModal = document.createElement("div");
          newModal.id = "preview-photo-modal";
          newModal.className =
            "hidden fixed inset-0 bg-black/70 z-50 flex items-center justify-center p-4";
          newModal.onclick = function () {
            if (event.target === this) closePreviewModal();
          };
          newModal.innerHTML = `
            <div class="bg-white rounded-3xl shadow-2xl w-full max-w-lg overflow-hidden">
              <div class="flex justify-between items-center px-6 py-4 border-b">
                <h3 class="font-bold text-lg">Lihat Foto</h3>
                <button type="button" onclick="closePreviewModal()" class="text-stone-400 hover:text-stone-600">
                  <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                  </svg>
                </button>
              </div>
              <div class="p-6 flex items-center justify-center bg-stone-900">
                <img id="preview-photo-img" src="" alt="Preview" class="max-w-full max-h-96 object-contain rounded-xl">
              </div>
            </div>
          `;
          document.body.appendChild(newModal);
        }
        const img = document.getElementById("preview-photo-img");
        img.src = imageUrl;
        document
          .getElementById("preview-photo-modal")
          .classList.remove("hidden");
      }

      function closePreviewModal() {
        const modal = document.getElementById("preview-photo-modal");
        if (modal) {
          modal.classList.add("hidden");
        }
      }

      function rotateCrop(degree) {
        if (globalCropper) {
          try {
            globalCropper.rotate(degree);
            updateCropPreview();
          } catch (err) {
            console.error("Rotate error:", err);
          }
        }
      }

      function resetCrop() {
        if (globalCropper) {
          try {
            globalCropper.reset();
            updateCropPreview();
          } catch (err) {
            console.error("Reset error:", err);
          }
        }
      }

      function zoomCrop(ratio) {
        if (globalCropper) {
          try {
            globalCropper.zoom(ratio);
            updateCropPreview();
            // Update slider position
            const currentZoom =
              globalCropper.getCanvasData().height /
              globalCropper.getImageData().naturalHeight;
            const slider = document.getElementById("zoom-slider");
            if (slider) {
              slider.value = Math.max(0, Math.min(5, currentZoom * 1.5));
            }
          } catch (err) {
            console.error("Zoom error:", err);
          }
        }
      }

      function zoomCropToValue(value) {
        if (globalCropper) {
          try {
            const imageData = globalCropper.getImageData();
            const canvasData = globalCropper.getCanvasData();
            const currentZoom = canvasData.height / imageData.naturalHeight;
            const targetZoom = value;
            const zoomRatio = targetZoom / currentZoom - 1;
            globalCropper.zoom(zoomRatio);
            updateCropPreview();
          } catch (err) {
            console.error("Zoom to value error:", err);
          }
        }
      }

      function setAspectRatio(ratio) {
        if (globalCropper) {
          try {
            globalCropper.setAspectRatio(ratio);
            updateCropPreview();
            // Update button styles
            document
              .querySelectorAll('[id^="aspect-"]')
              .forEach((btn) => btn.classList.remove("bg-brand", "text-white"));
            const selectedId =
              ratio === NaN || isNaN(ratio)
                ? "aspect-free"
                : ratio === 1
                  ? "aspect-1-1"
                  : ratio === 16 / 9
                    ? "aspect-16-9"
                    : ratio === 4 / 3
                      ? "aspect-4-3"
                      : ratio === 9 / 16
                        ? "aspect-9-16"
                        : "";
            if (selectedId) {
              document
                .getElementById(selectedId)
                ?.classList.add("bg-brand", "text-white");
            }
          } catch (err) {
            console.error("Set aspect ratio error:", err);
          }
        }
      }

      function flipCropH() {
        if (globalCropper) {
          try {
            const currentScaleX = globalCropper.getImageData().scaleX || 1;
            globalCropper.scaleX(-currentScaleX);
            updateCropPreview();
          } catch (err) {
            console.error("Flip horizontal error:", err);
          }
        }
      }

      function flipCropV() {
        if (globalCropper) {
          try {
            const currentScaleY = globalCropper.getImageData().scaleY || 1;
            globalCropper.scaleY(-currentScaleY);
            updateCropPreview();
          } catch (err) {
            console.error("Flip vertical error:", err);
          }
        }
      }

      function saveCrop() {
        if (!globalCropper) {
          Swal.fire({
            icon: "error",
            title: "Error",
            text: "Cropper tidak siap. Silakan coba lagi.",
          });
          return;
        }

        try {
          const canvas = globalCropper.getCroppedCanvas();

          if (!canvas) {
            Swal.fire({
              icon: "error",
              title: "Error",
              text: "Gagal membuat canvas. Silakan coba lagi.",
            });
            return;
          }

          // Convert canvas to blob dan simpan ke global variable
          canvas.toBlob(
            (blob) => {
              if (!blob) {
                Swal.fire({
                  icon: "error",
                  title: "Error",
                  text: "Gagal membuat file dari crop",
                });
                return;
              }

              // Simpan blob hasil crop ke variable global
              croppedImageBlob = blob;

              // Update preview dengan hasil crop
              const previewElement = document.getElementById(
                `preview-${currentCropType}${currentCropIndex}`,
              );
              if (previewElement) {
                previewElement.src = canvas.toDataURL();
                previewElement.classList.remove("hidden");
              }

              // Jika di edit mode, ubah icon kembali ke preview only setelah crop selesai
              if (currentCropType === "pengurus") {
                const formId = document.getElementById(
                  `form-${currentCropType}`,
                ).elements["id"];
                const isEditMode = formId && formId.value !== "";
                if (isEditMode) {
                  isNewPhotoInEditMode = false;
                  const previewBtn = document.getElementById(
                    `preview-btn-${currentCropType}`,
                  );
                  if (previewBtn) {
                    previewBtn.innerHTML = '<i class="fa-solid fa-eye"></i>';
                  }
                }
              }

              closeCropModal();

              Swal.fire({
                icon: "success",
                title: "Crop Berhasil",
                text: "Gambar berhasil di-crop. Silakan simpan form untuk menyimpan perubahan.",
                timer: 2000,
                showConfirmButton: false,
              });
            },
            "image/png",
            0.95,
          );
        } catch (err) {
          console.error("Save crop error:", err);
          Swal.fire({
            icon: "error",
            title: "Error",
            text: "Gagal menyimpan crop: " + err.message,
          });
        }
      }

      function resetCropFlag() {
        // Reset flag ketika modal ditutup
        if (currentCropType === "pengurus") {
          const formId = document.getElementById(`form-${currentCropType}`)
            .elements["id"];
          const isEditMode = formId && formId.value !== "";
          if (isEditMode && isNewPhotoInEditMode) {
            // Jika edit mode dan masih ada foto baru tapi crop dibatalkan, ubah icon ke eye
            isNewPhotoInEditMode = false;
            const previewBtn = document.getElementById(
              `preview-btn-${currentCropType}`,
            );
            if (previewBtn) {
              previewBtn.innerHTML = '<i class="fa-solid fa-eye"></i>';
            }
          }
        }
      }

      async function loadData(type) {
        try {
          const res = await fetch(`${API_BASE}?resource=${type}`);
          const data = await res.json();
          currentData[type] = data;
          const container = document.getElementById(`list-${type}`);
          container.innerHTML = "";

          data.forEach((item) => {
            const div = document.createElement("div");
            div.className =
              "bg-white p-4 rounded-2xl shadow-sm flex justify-between items-center border border-stone-200";

            if (type === "dokumentasi") {
              div.className =
                "relative group rounded-2xl overflow-hidden border border-stone-200";
              div.innerHTML = `
                            <img src="${item.image}" class="h-40 w-full object-cover">
                            <div class="absolute inset-0 bg-black/60 opacity-0 group-hover:opacity-100 flex flex-col items-center justify-center gap-2 transition-all">
                                <button onclick="editData('${type}', ${item.id})" class="bg-white text-brand px-6 py-1 rounded-full font-bold text-sm">EDIT</button>
                                <button onclick="deleteData('${type}', ${item.id})" class="bg-red-600 text-white px-6 py-1 rounded-full font-bold text-sm">HAPUS</button>
                            </div>
                        `;
            } else if (type === "statistik") {
              div.innerHTML = `
                            <div>
                                <p class="font-bold text-lg leading-tight">${item.label}</p>
                                <p class="text-3xl font-black text-brand">${item.value}<span class="text-lg">${item.suffix}</span></p>
                                <p class="text-xs text-stone-400 mt-2">Key: ${item.key_name}</p>
                            </div>
                            <div class="flex flex-col justify-center gap-2">
                                <button onclick="editData('${type}', ${item.id})" class="bg-stone-100 text-stone-600 px-4 py-2 rounded-xl font-bold hover:bg-brand hover:text-white transition-all text-xs">Edit Parameter</button>
                            </div>
                        `;
            } else if (type === "agenda") {
              div.innerHTML = `
                            <div>
                                <p class="font-bold text-lg leading-tight mb-1">${item.title}</p>
                                <p class="text-sm text-stone-500 font-bold">${item.date} — <span class="font-normal">${item.location}</span></p>
                            </div>
                            <div class="flex gap-2">
                                <button onclick="editData('${type}', ${item.id})" class="bg-stone-100 text-stone-600 px-4 py-2 rounded-xl font-bold hover:bg-brand hover:text-white transition-all">Edit</button>
                                <button onclick="deleteData('${type}', ${item.id})" class="bg-red-50 text-red-600 px-4 py-2 rounded-xl font-bold hover:bg-red-600 hover:text-white transition-all">Hapus</button>
                            </div>
                        `;
            } else {
              div.innerHTML = `
                            <div class="flex items-center gap-4">
                                <img src="${item.image}" class="w-16 h-16 object-cover rounded-xl border">
                                <div>
                                    <p class="font-bold text-lg leading-tight mt-1 mb-1">${item.title || item.nama}</p>
                                    <p class="text-xs font-black text-brand bg-brand/10 inline-block px-2 py-1 rounded-md mb-2">${item.kategori || "Umum"}</p>
                                    <p class="text-sm text-stone-500">${item.date || item.jabatan || ""}</p>
                                </div>
                            </div>
                            <div class="flex gap-2">
                                <button onclick="editData('${type}', ${item.id})" class="bg-stone-100 text-stone-600 px-4 py-2 rounded-xl font-bold hover:bg-brand hover:text-white transition-all">Edit</button>
                                <button onclick="deleteData('${type}', ${item.id})" class="bg-red-50 text-red-600 px-4 py-2 rounded-xl font-bold hover:bg-red-600 hover:text-white transition-all">Hapus</button>
                            </div>
                        `;
            }
            container.appendChild(div);
          });
        } catch (e) {
          console.error("Gagal load data", e);
        }
      }

      function editData(type, id) {
        const item = currentData[type].find((i) => i.id == id);
        if (!item) return;

        // Reset flag bahwa ini adalah foto lama, bukan baru
        if (type === "pengurus") {
          isNewPhotoInEditMode = false;
        }

        const form = document.getElementById(`form-${type}`);
        const title = document.getElementById(`form-title-${type}`);
        const btn = document.getElementById(`btn-submit-${type}`);
        const btnCancel = document.getElementById(`btn-cancel-${type}`);

        if (form.elements["id"]) form.elements["id"].value = item.id;
        if (form.elements["oldImage"])
          form.elements["oldImage"].value = item.image || "";
        if (type === "berita") {
          form.elements["title"].value = item.title;
          form.elements["date"].value = item.date;
          form.elements["kategori"].value = item.kategori || "Umum";
          form.elements["excerpt"].value = item.excerpt;
          quill.root.innerHTML = item.content;
        } else if (type === "dokumentasi") {
          form.elements["title"].value = item.title;
          form.elements["kategori"].value = item.kategori || "Umum";
          form.elements["imageFile"].removeAttribute("required"); // Not required when editing

          // Set hidden inputs for old images 2-5
          ["2", "3", "4", "5"].forEach((idx) => {
            const oldField = `oldImage${idx}`;
            if (form.elements[oldField]) {
              form.elements[oldField].value = item[`image${idx}`] || "";
            }
          });
        } else if (type === "pengurus") {
          form.elements["nama"].value = item.nama;
          form.elements["jabatan"].value = item.jabatan;
          form.elements["imageFile"].removeAttribute("required"); // Not required when editing
        } else if (type === "agenda") {
          form.elements["title"].value = item.title;
          form.elements["date"].value = item.date;
          form.elements["location"].value = item.location;
        } else if (type === "statistik") {
          form.elements["key_name"].value = item.key_name;
          form.elements["label"].value = item.label;
          form.elements["value"].value = item.value;
          form.elements["suffix"].value = item.suffix || "";
        }

        title.innerText = `Edit ${type.charAt(0).toUpperCase() + type.slice(1)}`;

        // Show existing image in preview
        const preview = document.getElementById(`preview-${type}`);
        if (preview) {
          if (item.image) {
            preview.src = item.image;
            preview.classList.remove("hidden");
          } else {
            preview.classList.add("hidden");
          }
        }

        // Update preview button icon untuk edit mode (hanya lihat) - karena belum upload foto baru
        if (type === "pengurus") {
          const previewBtn = document.getElementById("preview-btn-pengurus");
          if (previewBtn) {
            previewBtn.innerHTML = '<i class="fa-solid fa-eye"></i>';
          }
        }

        // Show secondary images for dokumentasi
        if (type === "dokumentasi") {
          ["2", "3", "4", "5"].forEach((idx) => {
            const prev = document.getElementById(`preview-dokumentasi${idx}`);
            if (prev) {
              if (item[`image${idx}`]) {
                prev.src = item[`image${idx}`];
                prev.classList.remove("hidden");
              } else {
                prev.src = "";
                prev.classList.add("hidden");
              }
            }
          });
        }

        btn.innerText = "Simpan Perubahan";
        btn.classList.remove("bg-brand");
        btn.classList.add("bg-orange-500");
        btnCancel.classList.remove("hidden");
        if (type === "statistik") {
          document
            .getElementById("form-container-statistik")
            .classList.remove("hidden");
        }
        window.scrollTo({ top: 0, behavior: "smooth" });
      }

      function resetForm(type) {
        const form = document.getElementById(`form-${type}`);
        const title = document.getElementById(`form-title-${type}`);
        const btn = document.getElementById(`btn-submit-${type}`);
        const btnCancel = document.getElementById(`btn-cancel-${type}`);
        const preview = document.getElementById(`preview-${type}`);

        form.reset();
        if (type === "berita") {
          quill.root.innerHTML = "";
        }
        if (type === "dokumentasi") {
          form.elements["imageFile"].setAttribute("required", "true");
        }
        if (type === "pengurus") {
          form.elements["imageFile"].setAttribute("required", "true");
        }

        // Clear all previews
        document.querySelectorAll(`[id^='preview-${type}']`).forEach((el) => {
          el.src = "";
          el.classList.add("hidden");
        });

        // Update preview button icon untuk tambah mode (bisa crop)
        // Reset flag bahwa tidak ada foto baru di edit mode
        if (type === "pengurus") {
          isNewPhotoInEditMode = false;
          const previewBtn = document.getElementById("preview-btn-pengurus");
          if (previewBtn) {
            previewBtn.innerHTML = '<i class="fa-solid fa-pen-to-square"></i>';
          }
        }

        if (form.elements["id"]) form.elements["id"].value = "";
        if (form.elements["oldImage"]) form.elements["oldImage"].value = "";
        title.innerText = `Tambah ${type.charAt(0).toUpperCase() + type.slice(1)} Baru`;
        btn.innerText = `Tambah ${type.charAt(0).toUpperCase() + type.slice(1)}`;
        btn.classList.remove("bg-orange-500");
        btn.classList.add("bg-brand");
        btnCancel.classList.add("hidden");
        if (type === "statistik") {
          document
            .getElementById("form-container-statistik")
            .classList.add("hidden");
        }
      }

      async function saveData(e, type) {
        e.preventDefault();
        const formData = new FormData(e.target);
        const id = formData.get("id");
        const isEdit = id && id !== "";

        // Gunakan cropped image jika tersedia
        if (croppedImageBlob) {
          formData.set("imageFile", croppedImageBlob, `crop-${Date.now()}.png`);
          croppedImageBlob = null;
        }

        if (type === "berita") {
          formData.set("content", quill.root.innerHTML);
          const dateVal = formData.get("date");
          if (!dateVal) {
            formData.set("date", new Date().toISOString().split("T")[0]);
          }
        }

        Swal.fire({
          title: "Menyimpan Data...",
          allowOutsideClick: false,
          didOpen: () => {
            Swal.showLoading();
          },
        });

        let url = `${API_BASE}?resource=${type}`;
        if (isEdit) url += `&action=update&id=${id}`;

        try {
          const res = await fetch(url, { method: "POST", body: formData });
          const result = await res.json();

          if (result.success || result.message) {
            Swal.fire({
              icon: "success",
              title: "Berhasil",
              text: isEdit
                ? "Perubahan berhasil disimpan!"
                : "Data baru berhasil ditambahkan!",
              timer: 2000,
              showConfirmButton: false,
            });
            resetForm(type);
            loadData(type);
          } else {
            Swal.fire({
              icon: "error",
              title: "Gagal",
              text: result.error || "Terjadi kesalahan saat menyimpan data",
            });
          }
        } catch (error) {
          Swal.fire({
            icon: "error",
            title: "Kesalahan",
            text: "Gagal terhubung ke server.",
          });
        }
      }

      async function deleteData(type, id) {
        const confirm = await Swal.fire({
          title: "Apakah Anda yakin?",
          text: "Data yang dihapus tidak dapat dikembalikan!",
          icon: "warning",
          showCancelButton: true,
          confirmButtonColor: "#00529b",
          cancelButtonColor: "#d33",
          confirmButtonText: "Ya, Hapus!",
          cancelButtonText: "Batal",
        });

        if (!confirm.isConfirmed) return;

        Swal.fire({
          title: "Menghapus...",
          allowOutsideClick: false,
          didOpen: () => {
            Swal.showLoading();
          },
        });

        try {
          const res = await fetch(
            `${API_BASE}?resource=${type}&action=delete&id=${id}`,
            { method: "POST" },
          );
          const result = await res.json();
          if (result.success) {
            Swal.fire({
              icon: "success",
              title: "Terhapus",
              text: "Data telah berhasil dihapus.",
              timer: 1500,
              showConfirmButton: false,
            });
            loadData(type);
          } else {
            Swal.fire({
              icon: "error",
              title: "Gagal",
              text: result.error || "Gagal menghapus data",
            });
          }
        } catch (error) {
          Swal.fire({
            icon: "error",
            title: "Kesalahan",
            text: "Terjadi masalah koneksi saat menghapus",
          });
        }
      }

      // Navbar scroll effect
      function initNavbarScroll() {
        const navbar = document.getElementById("admin-navbar");
        const maxScroll = document.querySelector(".max-w-6xl");

        window.addEventListener("scroll", function () {
          if (window.scrollY > 10) {
            navbar.classList.add("scrolled");
          } else {
            navbar.classList.remove("scrolled");
          }
        });
      }

      function handleNavClick(event) {
        event.preventDefault();
        showTab("berita");
      }

      checkAuth();
      initNavbarScroll();
    </script>

    <script>
      feather.replace();
    </script>
  </body>
